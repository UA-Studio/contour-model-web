# fly.io 설정. app 이름은 fly.io 에서 정한 이름으로 바꾼다.
app = "contour-model-web"
primary_region = "nrt"          # 도쿄: 한국에서 가장 가까움

[build]

[env]
  CONTOUR_MAX_SIDE = "1000"
  CONTOUR_RUNS_PER_DAY = "5"
  CONTOUR_MAX_UPLOAD_MB = "150"
  CONTOUR_JOB_MINUTES = "12"
  CONTOUR_KEEP_MINUTES = "60"    # 1시간 동안 쓰지 않으면 올린 파일·결과 삭제 (새로 만들면 이전 결과는 바로 삭제)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # 아무도 안 쓰면 꺼져서 비용이 거의 안 듦
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 100

[[mounts]]                       # 의견(feedback.jsonl)과 올린 파일을 담는 디스크
  source = "contour_data"
  destination = "/data"

[[vm]]                           # 전용 CPU 2개·8GB (2026-11-20 사용자 결정): 공유 CPU 는 8분쯤 뒤 12% 속도로 떨어져
  memory = "8gb"                 # 1000m 모델이 12분 제한에 걸렸다. 1000m 최대 메모리 약 5GB. 켜져 있는 시간만 과금.
  cpu_kind = "performance"
  cpus = 2
