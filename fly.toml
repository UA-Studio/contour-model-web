# fly.io 설정. app 이름은 fly.io 에서 정한 이름으로 바꾼다.
app = "contour-model"
primary_region = "nrt"          # 도쿄: 한국에서 가장 가까움

[build]

[env]
  CONTOUR_MAX_SIDE = "1000"
  CONTOUR_RUNS_PER_DAY = "5"
  CONTOUR_MAX_UPLOAD_MB = "150"
  CONTOUR_JOB_MINUTES = "12"
  CONTOUR_KEEP_HOURS = "24"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # 아무도 안 쓰면 꺼져서 비용이 거의 안 듦
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 100

[[mounts]]                       # 의견(feedback.jsonl)과 올린 파일을 담는 디스크
  source = "contour_data"
  destination = "/data"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
