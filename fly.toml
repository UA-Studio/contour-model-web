# fly.toml app configuration file generated for contour-model-web-jq9fig on 2026-11-27T03:48:00Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'contour-model-web-jq9fig'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CONTOUR_DATA = '/data'
  CONTOUR_JOB_MINUTES = '15'
  CONTOUR_KEEP_MINUTES = '120'
  CONTOUR_MAX_SIDE = '1000'
  CONTOUR_MAX_UPLOAD_MB = '200'
  CONTOUR_RUNS_PER_DAY = '100'
  CONTOUR_SERVER = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/config'

[[vm]]
  size = 'shared-cpu-4x'
  memory = '4gb'
