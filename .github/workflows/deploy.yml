name: fly.io 에 배포
# main 에 올린 커밋의 '자동 시험'이 모두 통과해야만 배포합니다.
on:
  workflow_run:
    workflows: [자동 시험]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # 아래 값은 GitHub 저장소 Settings › Secrets and variables › Actions 에 넣으면 서버로 옮겨진다 (없으면 건너뜀)
      CONTOUR_ADMIN_TOKEN: ${{ secrets.CONTOUR_ADMIN_TOKEN }}
      VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
      VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
      SAFEMAP_KEY: ${{ secrets.SAFEMAP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: 배포
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "FLY_API_TOKEN 비밀값이 아직 없어 배포를 건너뜁니다"; exit 0; fi
          APP=$(sed -n 's/^app *= *"\(.*\)".*/\1/p' fly.toml)
          # 처음 한 번: 앱과 디스크 만들기
          if ! flyctl status -a "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" || { echo "앱 이름 '$APP' 을 만들 수 없습니다 (이미 누가 쓰는 이름일 수 있음). fly.toml 의 app 이름을 바꿔 주세요."; exit 1; }
          fi
          if ! flyctl volumes list -a "$APP" | grep -q contour_data; then
            flyctl volumes create contour_data -a "$APP" -r nrt -s 5 -y
          fi
          # 디스크가 5GB 보다 작으면 늘린다 (1GB 로 시작해 결과 몇 개로 꽉 차던 것, 2026-11-20). 줄이기는 안 됨.
          flyctl volumes list -a "$APP" --json | jq -r '.[] | select(.name=="contour_data" and .size_gb < 5) | .id' | while read -r VOL; do
            flyctl volumes extend "$VOL" -s 5 -a "$APP" -y || echo "디스크 늘리기 실패 (배포는 계속): $VOL"
          done
          # 비밀값 옮기기 (값이 있는 것만)
          ARGS=""
          for k in CONTOUR_ADMIN_TOKEN VWORLD_KEY VWORLD_DOMAIN DATA_GO_KR_KEY SEOUL_KEY SAFEMAP_KEY; do
            v="${!k}"; [ -n "$v" ] && ARGS="$ARGS $k=$v"
          done
          [ -n "$ARGS" ] && flyctl secrets set --stage -a "$APP" $ARGS
          flyctl deploy --remote-only -a "$APP"
