name: fly.io 에 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "FLY_API_TOKEN 비밀값이 아직 없어 배포를 건너뜁니다"; exit 0; fi
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
