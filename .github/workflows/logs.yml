name: 서버 상태·기록 보기
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl status -a contour-model-web || true
          flyctl machine list -a contour-model-web || true
          flyctl logs -a contour-model-web --no-tail 2>&1 | tail -300 || true
