name: 윈도우 다운로드판
# 윈도우판(설치 없는 버전) zip 을 Windows 에서 묶고, 압축을 새로 푼 폴더의 '콘타모델 실행.bat' 을
# 더블클릭하듯 실행해 가짜 도엽으로 모델을 두 번 만들어 본다. 통과해야만 Releases 에 올린다.
#  - PR·브랜치: 묶고 시험만 (zip 은 Artifacts 에서 받을 수 있음)
#  - main: 이 버전(contour_ai/__init__.py)의 릴리스가 아직 없으면 묶고 시험해서 Releases 에 올림
on:
  push:
    branches: [main]
    paths: [contour_ai/**, requirements-server.txt, windows/**, docs/사용법_전체.md, .github/workflows/windows.yml]
  pull_request:
    paths: [contour_ai/**, requirements-server.txt, windows/**, tests/test_desktop.py, .github/workflows/windows.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 윈도우판 묶기·시험·올리기
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 버전 확인
        id: ver
        shell: bash
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' contour_ai/__init__.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          RELEASE=no
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if gh release view "v$V" >/dev/null 2>&1; then
              echo "v$V 릴리스가 이미 있어 건너뜁니다 (새로 올리려면 contour_ai/__init__.py 버전을 올리세요)"
              RELEASE=exists
            else
              RELEASE=yes
            fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.ver.outputs.release != 'exists'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-server.txt
      - name: 묶기
        if: steps.ver.outputs.release != 'exists'
        id: build
        run: python windows/build_windows.py dist
      - name: 시험 (zip 을 새 폴더에 풀어 .bat 실행 → 가짜 도엽으로 만들기 두 번)
        if: steps.ver.outputs.release != 'exists'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "풀어본 곳"
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "${{ steps.build.outputs.zip }}" "$dir"
          $bat = Join-Path $dir "콘타모델_윈도우\콘타모델 실행.bat"
          if (!(Test-Path $bat)) { throw "zip 안에 실행 파일이 없음" }
          # 묶음 파이썬이 이 컴퓨터의 파이썬 없이 라이브러리를 모두 불러오는지
          & (Join-Path $dir "콘타모델_윈도우\python\python.exe") -s -I -c "import sys, importlib.util, contour_ai, rasterio, ezdxf, trimesh, manifold3d, scipy, shapely, pyproj, matplotlib, mapbox_earcut, contourpy, shapefile; import contour_ai.pipeline; from rasterio.crs import CRS; assert CRS.from_epsg(5186).to_epsg() == 5186, '좌표계 자료'; assert importlib.util.find_spec('rhino3dm') is None, '윈도우판은 rhino3dm 없이'; print(ascii(sys.prefix), 'v' + contour_ai.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "묶음 안 라이브러리 불러오기 실패" }
          pip install -r requirements-server.txt pytest
          $env:CONTOUR_TEST_BAT = $bat
          $env:CONTOUR_EXPECT_VERSION = "${{ steps.ver.outputs.version }}"
          $env:CONTOUR_TEST_OUT = Join-Path $env:RUNNER_TEMP "시험결과"
          python -m pytest tests/test_desktop.py -v -s
          if ($LASTEXITCODE -ne 0) { throw "윈도우판 시험 실패" }
      - name: zip 보관 (Artifacts)
        if: steps.ver.outputs.release != 'exists'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.zip }}
          compression-level: 0
          retention-days: 14
      - name: Releases 에 올리기
        if: steps.ver.outputs.release == 'yes'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          cat > notes.md <<'EOF'
          ## 내려받기
          아래 **Assets** 의 `contour_model_windows_….zip` 을 받으세요.

          1. zip 을 오른쪽 클릭 → **모두 압축 풀기**
          2. 풀린 `콘타모델_윈도우` 폴더의 **콘타모델 실행.bat** 더블클릭 (파란 'PC 보호' 창이 뜨면 추가 정보 → 실행)
          3. 브라우저에 화면이 열리면 수치지도 2.0(SHP) zip 을 끌어다 놓고 만들기

          64비트 Windows 10·11. 파이썬 등 따로 설치할 것은 없습니다. 결과는 `C:\Users\내이름\콘타모델` 에 저장됩니다.
          이 판은 Windows 에서 압축을 새로 풀어 .bat 으로 가짜 도엽 모델을 만들어 보는 자동 시험을 통과했습니다.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "v$V" "${{ steps.build.outputs.zip }}" --target "$GITHUB_SHA" \
            --title "콘타 모델 윈도우판 v$V" --notes-file notes.md --latest
